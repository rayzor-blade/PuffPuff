name: release
run-name: release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'v<version> to publish; leave empty to validate only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package and validate the Haxelib
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if [ -n "$TAG" ]; then
            version=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from package_haxelib import version_of; print(version_of(sys.argv[1]))' "$TAG")
            [ "$version" = "$(python3 -c 'import json; print(json.load(open("haxelib.json"))["version"])')" ] ||
              { echo "haxelib.json version differs from $TAG"; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Download the pinned blinc_abi libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(python3 -c 'import json; s = json.load(open("native/hdlls.json"))["source"]; print(s["repository"], s["tag"])')
          set -- $source
          [ -n "$2" ] || { echo "native/hdlls.json has no release tag: run scripts/pin_native.py"; exit 1; }
          gh release download "$2" --repo "$1" --pattern 'blinc_abi-*.hdll' --dir native-assets
      - run: python3 scripts/package_haxelib.py release --assets native-assets ${TAG:+--version "$TAG"}
        env:
          TAG: ${{ steps.version.outputs.tag }}
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
      - run: haxelib newrepo
      - name: Install the package and its dependencies
        run: |
          haxelib install release/puffpuff.zip --always
          haxelib list
      - name: Compile a consumer and check the native library is staged
        run: |
          haxe tests/package/build.hxml
          cmp native-assets/blinc_abi-linux-x86_64.hdll tests/package/bin/blinc_abi.hdll
      - uses: actions/upload-artifact@v7
        with:
          name: puffpuff-haxelib
          path: release/puffpuff.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    if: needs.package.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: puffpuff-haxelib
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          files: release/puffpuff.zip
          generate_release_notes: true

  publish-haxelib:
    name: publish to Haxelib
    needs: [package, publish]
    if: needs.package.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.package.outputs.tag }}
    secrets:
      HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
