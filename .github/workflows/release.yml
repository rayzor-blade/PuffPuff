name: release
run-name: release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'v<version> to publish; leave empty to validate only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: blinc_abi ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     platform: macos-aarch64,  target: aarch64-apple-darwin,      library: libblinc_abi.dylib }
          - { os: macos-latest,     platform: macos-x86_64,   target: x86_64-apple-darwin,       library: libblinc_abi.dylib }
          - { os: ubuntu-24.04,     platform: linux-x86_64,   target: x86_64-unknown-linux-gnu,  library: libblinc_abi.so }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64,  target: aarch64-unknown-linux-gnu, library: libblinc_abi.so }
          - { os: windows-2022,     platform: windows-x86_64, target: x86_64-pc-windows-msvc,    library: blinc_abi.dll }
    steps:
      - uses: actions/checkout@v7
      - id: source
        shell: bash
        run: |
          # The revision native/hdlls.json pins; the matrix above must agree with its platforms.
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("native/hdlls.json"))
          e = m["platforms"]["${{ matrix.platform }}"]
          assert (e["runner"], e["target"], e["library"]) == ("${{ matrix.os }}", "${{ matrix.target }}", "${{ matrix.library }}"), "matrix differs from native/hdlls.json"
          print("repository=" + m["source"]["repository"])
          print("rev=" + m["source"]["rev"])
          PY
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.rev }}
          path: blinc_abi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blinc_abi
          shared-key: blinc_abi-${{ matrix.platform }}

      - name: Build the Windows runtime import library
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
          cmake -S /tmp/hashlink -B /tmp/hashlink/build -DWITH_VM=ON \
            -DWITH_FMT=OFF -DWITH_HEAPS=OFF -DWITH_OPENAL=OFF -DWITH_SDL=OFF \
            -DWITH_SQLITE=OFF -DWITH_SSL=OFF -DWITH_UI=OFF -DWITH_UV=OFF \
            -DWITH_VIDEO=OFF
          cmake --build /tmp/hashlink/build --config Release --target libhl
          libdir=$(dirname "$(find /tmp/hashlink/build -name 'libhl.lib' | head -1)")
          test -f "$libdir/libhl.lib"
          echo "HL_LIB_DIR=$(cygpath -w "$libdir")" >> "$GITHUB_ENV"

      - name: Build the native library
        shell: bash
        working-directory: blinc_abi
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Collect the library
        shell: bash
        run: |
          mkdir -p out
          cp "blinc_abi/target/${{ matrix.target }}/release/${{ matrix.library }}" "out/blinc_abi-${{ matrix.platform }}.hdll"
      - uses: actions/upload-artifact@v7
        with:
          name: hdll-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  package:
    name: package and validate the Haxelib
    needs: native
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if [ -n "$TAG" ]; then
            version=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from package_haxelib import version_of; print(version_of(sys.argv[1]))' "$TAG")
            [ "$version" = "$(python3 -c 'import json; print(json.load(open("haxelib.json"))["version"])')" ] ||
              { echo "haxelib.json version differs from $TAG"; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: hdll-*
          path: native-assets
          merge-multiple: true
      - run: python3 scripts/package_haxelib.py release --assets native-assets ${TAG:+--version "$TAG"}
        env:
          TAG: ${{ steps.version.outputs.tag }}
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
      - run: haxelib newrepo
      - name: Install the package and its dependencies
        run: |
          haxelib install release/puffpuff.zip --always
          haxelib list
      - name: Compile a consumer and check the native library is staged
        run: |
          haxe tests/package/build.hxml
          cmp native-assets/blinc_abi-linux-x86_64.hdll tests/package/bin/blinc_abi.hdll
      - uses: actions/upload-artifact@v7
        with:
          name: puffpuff-haxelib
          path: release/puffpuff.zip
          if-no-files-found: error

  hashlink:
    name: HashLink on ${{ matrix.platform }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # HashLink has no JIT VM for Apple silicon (it only compiles to C there), so macOS arm64 is covered
        # by the Intel job: the same source builds both libraries.
        include:
          - { os: ubuntu-24.04,     platform: linux-x86_64,   hashlink: linux-amd64,  haxe: 4.3.6 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64,  hashlink: linux-arm64,  haxe: 4.3.7 }
          - { os: macos-15-intel,   platform: macos-x86_64,   hashlink: darwin-cmake, haxe: 4.3.6 }
          - { os: windows-2022,     platform: windows-x86_64, hashlink: win64,        haxe: 4.3.6 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: puffpuff-haxelib
          path: release
      - uses: krdlab/setup-haxe@v2
        if: matrix.platform != 'linux-aarch64'
        with:
          haxe-version: ${{ matrix.haxe }}
      - name: Install Haxe 4.3.7, the first release with a Linux ARM build
        if: matrix.platform == 'linux-aarch64'
        run: |
          mkdir -p "$HOME/haxe" "$HOME/neko"
          curl -fsSL https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-linux-arm64.tar.gz | tar xz --strip-components=1 -C "$HOME/haxe"
          curl -fsSL https://github.com/HaxeFoundation/neko/releases/download/v2-4-1/neko-2.4.1-linux-arm64.tar.gz | tar xz --strip-components=1 -C "$HOME/neko"
          echo "$HOME/haxe" >> "$GITHUB_PATH"
          echo "$HOME/neko" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=$HOME/haxe/std" >> "$GITHUB_ENV"
          echo "NEKOPATH=$HOME/neko" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/neko" >> "$GITHUB_ENV"
          mkdir -p "$HOME/haxelib"
          PATH="$HOME/haxe:$HOME/neko:$PATH" NEKOPATH="$HOME/neko" LD_LIBRARY_PATH="$HOME/neko" haxelib setup "$HOME/haxelib"
      - run: haxelib newrepo
      - run: haxelib install release/puffpuff.zip --always
      - name: Install the libraries HashLink's fmt.hdll loads
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpng16-16t64 libturbojpeg libvorbisfile3 libogg0 zlib1g
      - name: Get HashLink
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # The macOS nightly has the libraries but no hl executable.
            brew install hashlink
            echo "HL=$(brew --prefix)/bin/hl" >> "$GITHUB_ENV"
            echo "HL_LIBS=$(brew --prefix)/lib" >> "$GITHUB_ENV"
            exit 0
          fi
          gh release download latest --repo HaxeFoundation/hashlink --pattern "hashlink-*-${{ matrix.hashlink }}.*" --dir hashlink-download
          cd hashlink-download
          shopt -s nullglob
          for f in *.tar.gz; do tar xzf "$f"; done
          for f in *.zip; do unzip -q "$f"; done
          hl=$(find . -type f \( -name hl -o -name hl.exe \) | head -1)
          echo "HL=$(cd "$(dirname "$hl")" && pwd)/$(basename "$hl")" >> "$GITHUB_ENV"
          echo "HL_LIBS=$(cd "$(dirname "$hl")" && pwd)" >> "$GITHUB_ENV"
      - name: Get xavi.hdll, which Haxe cannot download on this runner
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.2 --repo rayzor-blade/hlavi --pattern xavi-windows-x86_64.hdll --dir xavi
          echo "HAXE_FLAGS=-D hlavi_hdll=$(cygpath -w "$PWD/xavi/xavi-windows-x86_64.hdll")" >> "$GITHUB_ENV"
      - name: Compile with the blinc_abi natives bound
        shell: bash
        run: haxe tests/natives/build.hxml $HAXE_FLAGS
      - name: Load it on HashLink
        shell: bash
        run: |
          "$HL" --version
          cd tests/natives/bin
          case "$RUNNER_OS" in
            Linux) export LD_LIBRARY_PATH="$PWD:$HL_LIBS" ;;
            macOS) export DYLD_LIBRARY_PATH="$PWD:$HL_LIBS" ;;
            Windows) export PATH="$PWD:$HL_LIBS:$PATH" ;;
          esac
          "$HL" natives.hl | tee out.txt
          grep -q "all natives bound" out.txt

  publish:
    name: publish release
    needs: [package, hashlink]
    if: needs.package.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: puffpuff-haxelib
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          files: release/puffpuff.zip
          generate_release_notes: true

  publish-haxelib:
    name: publish to Haxelib
    needs: [package, publish]
    if: needs.package.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.package.outputs.tag }}
    secrets:
      HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
