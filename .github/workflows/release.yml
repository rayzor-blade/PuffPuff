name: release
run-name: release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'v<version> to publish; leave empty to validate only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: blinc_abi ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     platform: macos-aarch64,  target: aarch64-apple-darwin,      library: libblinc_abi.dylib }
          - { os: macos-latest,     platform: macos-x86_64,   target: x86_64-apple-darwin,       library: libblinc_abi.dylib }
          - { os: ubuntu-24.04,     platform: linux-x86_64,   target: x86_64-unknown-linux-gnu,  library: libblinc_abi.so }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64,  target: aarch64-unknown-linux-gnu, library: libblinc_abi.so }
          - { os: windows-2022,     platform: windows-x86_64, target: x86_64-pc-windows-msvc,    library: blinc_abi.dll }
    steps:
      - uses: actions/checkout@v7
      - id: source
        shell: bash
        run: |
          # The revision native/hdlls.json pins; the matrix above must agree with its platforms.
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("native/hdlls.json"))
          e = m["platforms"]["${{ matrix.platform }}"]
          assert (e["runner"], e["target"], e["library"]) == ("${{ matrix.os }}", "${{ matrix.target }}", "${{ matrix.library }}"), "matrix differs from native/hdlls.json"
          print("repository=" + m["source"]["repository"])
          print("rev=" + m["source"]["rev"])
          PY
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.rev }}
          path: blinc_abi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blinc_abi
          shared-key: blinc_abi-${{ matrix.platform }}

      - name: Build the Windows runtime import library
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
          cmake -S /tmp/hashlink -B /tmp/hashlink/build -DWITH_VM=ON \
            -DWITH_FMT=OFF -DWITH_HEAPS=OFF -DWITH_OPENAL=OFF -DWITH_SDL=OFF \
            -DWITH_SQLITE=OFF -DWITH_SSL=OFF -DWITH_UI=OFF -DWITH_UV=OFF \
            -DWITH_VIDEO=OFF
          cmake --build /tmp/hashlink/build --config Release --target libhl
          libdir=$(dirname "$(find /tmp/hashlink/build -name 'libhl.lib' | head -1)")
          test -f "$libdir/libhl.lib"
          echo "HL_LIB_DIR=$(cygpath -w "$libdir")" >> "$GITHUB_ENV"

      - name: Build the native library
        shell: bash
        working-directory: blinc_abi
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Collect the library
        shell: bash
        run: |
          mkdir -p out
          cp "blinc_abi/target/${{ matrix.target }}/release/${{ matrix.library }}" "out/blinc_abi-${{ matrix.platform }}.hdll"
      - uses: actions/upload-artifact@v7
        with:
          name: hdll-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  package:
    name: package and validate the Haxelib
    needs: native
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if [ -n "$TAG" ]; then
            version=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from package_haxelib import version_of; print(version_of(sys.argv[1]))' "$TAG")
            [ "$version" = "$(python3 -c 'import json; print(json.load(open("haxelib.json"))["version"])')" ] ||
              { echo "haxelib.json version differs from $TAG"; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: hdll-*
          path: native-assets
          merge-multiple: true
      - run: python3 scripts/package_haxelib.py release --assets native-assets ${TAG:+--version "$TAG"}
        env:
          TAG: ${{ steps.version.outputs.tag }}
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
      - run: haxelib newrepo
      - name: Install the package and its dependencies
        run: |
          haxelib install release/puffpuff.zip --always
          haxelib list
      - name: Compile a consumer and check the native library is staged
        run: |
          haxe tests/package/build.hxml
          cmp native-assets/blinc_abi-linux-x86_64.hdll tests/package/bin/blinc_abi.hdll
      - uses: actions/upload-artifact@v7
        with:
          name: puffpuff-haxelib
          path: release/puffpuff.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    if: needs.package.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: puffpuff-haxelib
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          files: release/puffpuff.zip
          generate_release_notes: true

  publish-haxelib:
    name: publish to Haxelib
    needs: [package, publish]
    if: needs.package.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.package.outputs.tag }}
    secrets:
      HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
