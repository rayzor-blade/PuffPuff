name: publish Haxelib

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, v<version>'
        required: true
        type: string
      publish:
        description: 'Submit the validated release package to Haxelib'
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      HAXELIB_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: haxelib-puffpuff
  cancel-in-progress: false

jobs:
  publish:
    name: validate and publish package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rayzor-blade/PuffPuff
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      # Use the current publisher script, even for an older release.
      - uses: actions/checkout@v7
        with:
          repository: rayzor-blade/PuffPuff
          ref: main
          persist-credentials: false
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
      - run: haxelib newrepo
      - name: Download the existing release package
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern puffpuff.zip --dir release
      - name: Validate the archive and version
        run: python3 scripts/publish_haxelib.py release/puffpuff.zip --tag "$RELEASE_TAG"
      - name: Submit
        if: inputs.publish
        env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: python3 scripts/publish_haxelib.py release/puffpuff.zip --tag "$RELEASE_TAG" --submit
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.publish }}
        with:
          name: validated-haxelib-puffpuff
          path: release/puffpuff.zip
          if-no-files-found: error
